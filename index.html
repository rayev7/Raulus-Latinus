.sidebar-logo .subtitle {

.streak-card .streak-info .streak-label {

.lang-selector {

.lang-selector select {

}

.lang-selector select option {

.theme-toggle {

  padding: 8px;

  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: var(--sidebar-text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}

.theme-toggle:hover {
  background: rgba(255,255,255,0.1);
}

/* Topbar */
.topbar {
  position: fixed;
  top: 0;
  left: 280px;
  right: 0;
  height: 60px;
  background: var(--topbar-bg);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 90;
}

[dir="rtl"] .topbar {
  left: 0;
  right: 280px;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.burger-btn {
  display: none;
  background: none;
  border: none;
  font-size: 24px;
  color: var(--text);
  cursor: pointer;
}

.topbar-pills {
  display: flex;
  gap: 12px;
}

.pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}

.pill-streak {
  background: rgba(245, 158, 11, 0.12);
  color: var(--gold);
}

.pill-xp {
  background: rgba(139, 92, 246, 0.12);
  color: var(--accent);
}

.pill-level {
  background: rgba(34, 197, 94, 0.12);
  color: var(--green);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.direction-select {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  background: var(--card);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  outline: none;
}

/* Main content */
.main-content {
  margin-left: 280px;
  margin-top: 60px;
  padding: 24px;
  position: relative;
  z-index: 1;
  min-height: calc(100vh - 60px);
}

[dir="rtl"] .main-content {
  margin-left: 0;
  margin-right: 280px;
}

/* Pages */
.page {
  display: none;
  animation: fadeSlideIn 0.4s ease;
}

.page.active {
  display: block;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Level Path */
.level-path-container {
  max-width: 500px;
  margin: 0 auto;
  padding: 20px 0;
}

.level-path-header {
  text-align: center;
  margin-bottom: 30px;
}

.level-path-header h2 {
  font-family: 'Cinzel', serif;
  font-size: 28px;
  color: var(--text);
  margin-bottom: 8px;
}

.level-path-header p {
  color: var(--text2);
  font-size: 14px;
}

.level-row {
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
  position: relative;
}

.level-row:nth-child(odd) {
  transform: translateX(-40px);
}

.level-row:nth-child(even) {
  transform: translateX(40px);
}

.level-node {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  border: 3px solid transparent;
}

.level-node.completed {
  background: linear-gradient(135deg, var(--green), var(--green-dark));
  color: white;
  border-color: var(--green);
  box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
}

.level-node.completed::after {
  content: '✓';
  position: absolute;
  top: -6px;
  right: -6px;
  width: 20px;
  height: 20px;
  background: white;
  color: var(--green);
  border-radius: 50%;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.level-node.current {
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(139, 92, 246, 0.3);
  animation: currentPulse 2s ease-in-out infinite;
  transform: scale(1.1);
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(139, 92, 246, 0.3); }
  50% { box-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(139, 92, 246, 0.4); }
}

.level-node.locked {
  background: var(--locked-bg);
  color: var(--locked);
  border-color: var(--locked-bg);
  cursor: not-allowed;
  opacity: 0.6;
}

.level-node.locked .lock-icon {
  font-size: 20px;
}

.level-node.boss {
  width: 80px;
  height: 80px;
  font-size: 20px;
  border-width: 4px;
}

.level-node.boss.locked {
  border-color: rgba(220, 38, 38, 0.3);
}

.level-node.boss.current {
  border-color: var(--boss-red);
  box-shadow: 0 0 25px rgba(220, 38, 38, 0.5), 0 0 50px rgba(220, 38, 38, 0.3);
}

.level-node.boss.completed {
  border-color: var(--gold);
  background: linear-gradient(135deg, var(--gold), #d97706);
}

.level-node.boss::before {
  content: '👑';
  position: absolute;
  top: -16px;
  font-size: 18px;
}

.level-connector {
  width: 3px;
  height: 20px;
  background: var(--card-border);
  margin: 0 auto;
}

.level-connector.active {
  background: var(--green);
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  transition: all 0.3s;
}

.card:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.card h3 {
  font-family: 'Cinzel', serif;
  font-size: 20px;
  margin-bottom: 12px;
}

/* Quiz */
.quiz-container {
  max-width: 600px;
  margin: 0 auto;
}

.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.quiz-progress {
  width: 100%;
  height: 10px;
  background: var(--progress-bg);
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 8px;
}

.quiz-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--green));
  border-radius: 5px;
  transition: width 0.5s ease;
}

.quiz-question {
  text-align: center;
  padding: 30px 0;
  animation: slideInRight 0.3s ease;
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(50px); }
  to { opacity: 1; transform: translateX(0); }
}

.quiz-question .q-label {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 8px;
}

.quiz-question .q-word {
  font-family: 'Cinzel', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 24px;
}

.quiz-question .q-extra {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 16px;
}

.quiz-input {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  padding: 14px 20px;
  border-radius: 12px;
  border: 2px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 18px;
  text-align: center;
  outline: none;
  transition: border-color 0.3s;
}

.quiz-input:focus {
  border-color: var(--accent);
}

.quiz-input.correct {
  border-color: var(--green);
  background: rgba(34, 197, 94, 0.08);
  animation: popCorrect 0.4s ease;
}

.quiz-input.wrong {
  border-color: var(--red);
  background: rgba(239, 68, 68, 0.08);
  animation: shakeWrong 0.4s ease;
}

@keyframes popCorrect {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

@keyframes shakeWrong {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-10px); }
  80% { transform: translateX(10px); }
}

.quiz-btn {
  display: inline-block;
  margin-top: 16px;
  padding: 12px 32px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.quiz-btn-primary {
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  color: white;
}

.quiz-btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 15px var(--accent-glow);
}

.quiz-btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--card-border);
}

.quiz-feedback {
  margin-top: 16px;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
}

.quiz-feedback.correct {
  background: rgba(34, 197, 94, 0.12);
  color: var(--green);
}

.quiz-feedback.wrong {
  background: rgba(239, 68, 68, 0.12);
  color: var(--red);
}

/* Results */
.results-container {
  max-width: 500px;
  margin: 0 auto;
  text-align: center;
  animation: fadeSlideIn 0.5s ease;
}

.results-container .results-icon {
  font-size: 64px;
  margin-bottom: 16px;
}

.results-container h2 {
  font-family: 'Cinzel', serif;
  font-size: 28px;
  margin-bottom: 8px;
}

.results-container .results-score {
  font-size: 48px;
  font-weight: 700;
  color: var(--accent);
  margin: 16px 0;
}

.results-container .results-detail {
  color: var(--text2);
  margin-bottom: 24px;
}

.results-stats {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.results-stat {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 16px 24px;
  min-width: 100px;
}

.results-stat .stat-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
}

.results-stat .stat-label {
  font-size: 12px;
  color: var(--text2);
}

/* Vocab Learn */
.vocab-card {
  max-width: 500px;
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  position: relative;
  min-height: 300px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.vocab-card .vocab-latin {
  font-family: 'Cinzel', serif;
  font-size: 36px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 12px;
}

.vocab-card .vocab-translation {
  font-size: 22px;
  color: var(--text);
  margin-bottom: 16px;
}

.vocab-card .vocab-details {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.8;
}

.vocab-card .vocab-details span {
  display: inline-block;
  background: rgba(139, 92, 246, 0.08);
  padding: 3px 10px;
  border-radius: 6px;
  margin: 2px;
}

.vocab-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 20px;
}

.vocab-nav button {
  padding: 10px 24px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  background: var(--card);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.vocab-nav button:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.vocab-counter {
  font-size: 14px;
  color: var(--text2);
}

/* Avatar Page */
.avatar-page {
  max-width: 700px;
  margin: 0 auto;
}

.avatar-display {
  text-align: center;
  margin-bottom: 24px;
}

.avatar-display svg {
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.15));
}

.inventory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}

.inventory-item {
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.inventory-item:hover {
  border-color: var(--accent);
}

.inventory-item.equipped {
  border-color: var(--green);
  background: rgba(34, 197, 94, 0.08);
}

.inventory-item.locked {
  opacity: 0.4;
  cursor: not-allowed;
}

.inventory-item .item-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.inventory-item .item-name {
  font-size: 12px;
  font-weight: 600;
}

.inventory-item .item-req {
  font-size: 10px;
  color: var(--text2);
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
}

.stat-card .stat-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card .stat-value {
  font-size: 32px;
  font-weight: 700;
  color: var(--accent);
}

.stat-card .stat-label {
  font-size: 13px;
  color: var(--text2);
  margin-top: 4px;
}

/* Daily history */
.history-list {
  max-height: 300px;
  overflow-y: auto;
}

.history-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--card-border);
  font-size: 14px;
}

.history-item .h-date {
  color: var(--text2);
}

.history-item .h-score {
  font-weight: 600;
  color: var(--accent);
}

/* Lesson header on quiz pages */
.lesson-badge {
  display: inline-block;
  background: rgba(139, 92, 246, 0.1);
  color: var(--accent);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 12px;
}

/* Genitiv/Genus sub-question */
.sub-question {
  margin-top: 16px;
  padding: 16px;
  background: rgba(139, 92, 246, 0.05);
  border-radius: 12px;
}

.sub-question label {
  display: block;
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 6px;
}

.sub-question input, .sub-question select {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 14px;
  margin: 4px;
  outline: none;
}

.sub-question input:focus, .sub-question select:focus {
  border-color: var(--accent);
}

/* Mobile sidebar overlay */
.sidebar-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}

/* Responsive */
@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
  }

  [dir="rtl"] .sidebar {
    transform: translateX(100%);
  }

  .sidebar.open {
    transform: translateX(0) !important;
  }

  .sidebar-overlay.show {
    display: block;
  }

  .topbar {
    left: 0 !important;
    right: 0 !important;
  }

  .main-content {
    margin-left: 0 !important;
    margin-right: 0 !important;
  }

  .burger-btn {
    display: block;
  }

  .level-row:nth-child(odd) {
    transform: translateX(-20px);
  }

  .level-row:nth-child(even) {
    transform: translateX(20px);
  }
}

/* Genitiv/Genus Quiz special styling */
.gengen-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 8px;
}

.gengen-row input {
  width: 140px;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--locked);
  border-radius: 3px;
}

/* XP popup animation */
.xp-popup {
  position: fixed;
  top: 80px;
  right: 24px;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  color: white;
  padding: 12px 24px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 16px;
  z-index: 200;
  animation: xpPop 2s ease forwards;
  pointer-events: none;
}

[dir="rtl"] .xp-popup {
  right: auto;
  left: 24px;
}

@keyframes xpPop {
  0% { opacity: 0; transform: translateY(20px); }
  20% { opacity: 1; transform: translateY(0); }
  80% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-30px); }
}

/* Page section titles */
.section-title {
  font-family: 'Cinzel', serif;
  font-size: 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Mode selection buttons */
.mode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.mode-card {
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}

.mode-card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(139, 92, 246, 0.15);
}

.mode-card .mode-icon {
  font-size: 40px;
  margin-bottom: 12px;
}

.mode-card .mode-title {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 6px;
}

.mode-card .mode-desc {
  font-size: 12px;
  color: var(--text2);
}

/* Lesson filter for learn/test */
.lesson-filter {
  margin-bottom: 16px;
}

.lesson-filter select {
  padding: 8px 14px;

  border: 1px solid var(--card-border);
  background: var(--card);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;

}

// ======================== PARSE VOCAB ========================
function parseVocabData(raw) {
  var lines = raw.split('\n');
  var result = [];
  var currentLesson = '';
  var idCounter = 0;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (line.startsWith('Lektion:')) {
      currentLesson = line.replace('Lektion:', '').trim();
      continue;
    }
    var parts = line.split(';');
    if (parts.length >= 5) {
      idCounter++;
      result.push({
        id: 'v' + idCounter,
        latin: parts[0].trim(),
        translation: parts[1].trim(),
        genitiv: parts[2].trim(),
        genus: parts[3].trim(),
        stammformen: parts[4].trim(),
        lesson: currentLesson
      });
    }
  }
  return result;
}

// ======================== STORAGE ========================
function loadData() {
  var stored = localStorage.getItem('raulus_latinus_final');
  if (stored) {
    vocabData = JSON.parse(stored);
  } else {
    vocabData = parseVocabData(rawVocabData);
    localStorage.setItem('raulus_latinus_final', JSON.stringify(vocabData));
  }

  var state = localStorage.getItem('raulus_state');
  if (state) {
    var s = JSON.parse(state);
    userXP = s.xp || 0;
    userStreak = s.streak || 0;
    userLevel = s.level || 1;
    completedLevels = s.completedLevels || [];
    currentLevelNum = s.currentLevelNum || 1;
    equippedItems = s.equippedItems || [];
    unlockedItems = s.unlockedItems || ['tunika'];
    dailyHistory = s.dailyHistory || [];
    lastActiveDate = s.lastActiveDate || '';
    currentLang = s.lang || 'de';
    currentDirection = s.direction || 'la-de';
  }

  checkStreak();
}

function saveState() {
  localStorage.setItem('raulus_state', JSON.stringify({
    xp: userXP,
    streak: userStreak,
    level: userLevel,
    completedLevels: completedLevels,
    currentLevelNum: currentLevelNum,
    equippedItems: equippedItems,
    unlockedItems: unlockedItems,
    dailyHistory: dailyHistory,
    lastActiveDate: lastActiveDate,
    lang: currentLang,
    direction: currentDirection
  }));
}

function checkStreak() {
  var today = getToday();
  if (lastActiveDate === '') {
    lastActiveDate = today;
    saveState();
    return;
  }
  var lastDate = new Date(lastActiveDate);
  var todayDate = new Date(today);
  var diff = Math.floor((todayDate - lastDate) / (1000 * 60 * 60 * 24));
  if (diff > 1) {
    userStreak = 0;
    saveState();
  }
}

function getToday() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function addXP(amount) {
  userXP = (userXP || 0) + amount;
  var oldLevel = userLevel;
  userLevel = Math.floor(userXP / 100) + 1;
  if (userLevel > oldLevel) {
    checkBossRewards();
  }
  var today = getToday();
  if (lastActiveDate !== today) {
    var lastDate = new Date(lastActiveDate);
    var todayDate = new Date(today);
    var diff = Math.floor((todayDate - lastDate) / (1000 * 60 * 60 * 24));
    if (diff === 1) {
      userStreak = (userStreak || 0) + 1;
    } else if (diff > 1) {
      userStreak = 1;
    }
    lastActiveDate = today;
  }
  saveState();
  updateUI();
  showXPPopup(amount);
}

function showXPPopup(amount) {
  var popup = document.createElement('div');
  popup.className = 'xp-popup';
  popup.textContent = '+' + amount + ' XP';
  document.body.appendChild(popup);
  setTimeout(function() { popup.remove(); }, 2100);
}

// ======================== LESSON HELPERS ========================
function getLessons() {
  var lessons = [];
  var seen = {};
  for (var i = 0; i < vocabData.length; i++) {
    var l = vocabData[i].lesson;
    if (!seen[l]) {
      seen[l] = true;
      lessons.push(l);
    }
  }
  return lessons;
}

function getVocabByLesson(lesson) {
  if (lesson === 'all') return vocabData.slice();
  return vocabData.filter(function(v) { return v.lesson === lesson; });
}

// ======================== LEVENSHTEIN ========================
function levenshtein(a, b) {
  a = a.toLowerCase().trim();
  b = b.toLowerCase().trim();
  if (a === b) return 0;
  var m = a.length, n = b.length;
  var dp = [];
  for (var i = 0; i <= m; i++) {
    dp[i] = [];
    for (var j = 0; j <= n; j++) {
      if (i === 0) dp[i][j] = j;
      else if (j === 0) dp[i][j] = i;
      else {
        dp[i][j] = Math.min(
          dp[i-1][j] + 1,
          dp[i][j-1] + 1,
          dp[i-1][j-1] + (a[i-1] !== b[j-1] ? 1 : 0)
        );
      }
    }
  }
  return dp[m][n];
}

function isAnswerCorrect(userAnswer, correctAnswer) {
  var ua = userAnswer.toLowerCase().trim();
  var ca = correctAnswer.toLowerCase().trim();
  if (ua === ca) return true;
  // Check alternatives split by /
  var alternatives = ca.split('/');
  for (var i = 0; i < alternatives.length; i++) {
    var alt = alternatives[i].trim();
    if (ua === alt) return true;
    if (alt.length > 3 && levenshtein(ua, alt) <= 1) return true;
  }
  // Tolerance for the whole string
  if (ca.length > 3 && levenshtein(ua, ca) <= 1) return true;
  return false;
}

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = a[i];
    a[i] = a[j];
    a[j] = temp;
  }
  return a;
}

function getQuestionDirection(vocab) {
  var dir = currentDirection;
  if (dir === 'mix') {
    dir = Math.random() > 0.5 ? 'la-de' : 'de-la';
  }
  if (dir === 'la-de') {
    return { question: vocab.latin, answer: vocab.translation, label: t('translate_word') };
  } else {
    return { question: vocab.translation, answer: vocab.latin, label: t('translate_word') };
  }
}

// ======================== LEVEL PATH ========================
function renderLevelPath() {
  var container = document.getElementById('levelPathGrid');
  container.innerHTML = '';

  for (var lvl = 1; lvl <= 50; lvl++) {
    var isBoss = (lvl % 10 === 0);
    var isCompleted = completedLevels.indexOf(lvl) !== -1;
    var isCurrent = (lvl === currentLevelNum);
    var isLocked = (lvl > currentLevelNum);

    var stateClass = isCompleted ? 'completed' : (isCurrent ? 'current' : 'locked');
    var bossClass = isBoss ? ' boss' : '';

    var row = document.createElement('div');
    row.className = 'level-row';

    var node = document.createElement('div');
    node.className = 'level-node ' + stateClass + bossClass;
    node.setAttribute('data-level', lvl);

    if (isLocked) {
      node.innerHTML = '<span class="lock-icon">🔒</span>';
    } else {
      node.textContent = lvl;
    }

    if (!isLocked) {
      node.onclick = (function(l) {
        return function() { startLevelQuiz(l); };
      })(lvl);
    }

    row.appendChild(node);
    container.appendChild(row);

    if (lvl < 50) {
      var conn = document.createElement('div');
      conn.className = 'level-connector' + (isCompleted ? ' active' : '');
      container.appendChild(conn);
    }
  }
}

// ======================== LEVEL QUIZ ========================
var levelQuizState = {};

window.startLevelQuiz = function(lvl) {
  var isBoss = (lvl % 10 === 0);
  var numQuestions = isBoss ? 10 : 5;
  var pool = shuffleArray(vocabData).slice(0, numQuestions);

  levelQuizState = {
    level: lvl,
    isBoss: isBoss,
    questions: pool,
    current: 0,
    correctCount: 0,
    totalQuestions: numQuestions,
    xpReward: isBoss ? 200 : 50
  };

  navigateTo('levelquiz');
  renderLevelQuizQuestion();
};

function renderLevelQuizQuestion() {
  var s = levelQuizState;
  var container = document.getElementById('levelQuizContent');

  if (s.current >= s.totalQuestions) {
    renderLevelQuizResults();
    return;
  }

  var vocab = s.questions[s.current];
  var qd = getQuestionDirection(vocab);
  var progress = ((s.current) / s.totalQuestions) * 100;
  var bossLabel = s.isBoss ? (' 👑 ' + t('boss_level')) : '';

  container.innerHTML = '<div class="quiz-header">' +
    '<span class="lesson-badge">' + t('level') + ' ' + s.level + bossLabel + '</span>' +
    '<span>' + (s.current + 1) + ' / ' + s.totalQuestions + '</span>' +
    '</div>' +
    '<div class="quiz-progress"><div class="quiz-progress-fill" style="width:' + progress + '%"></div></div>' +
    '<div class="quiz-question" id="quizQuestionArea">' +
    '<div class="q-label">' + qd.label + '</div>' +
    '<div class="q-word">' + qd.question + '</div>' +
    '<input class="quiz-input" id="levelQuizInput" type="text" placeholder="' + t('your_answer') + '" autocomplete="off" />' +
    '<div id="levelQuizFeedback"></div>' +
    '<br/><button class="quiz-btn quiz-btn-primary" id="levelQuizCheckBtn" onclick="checkLevelQuizAnswer()">' + t('check') + '</button>' +
    '</div>';

  var inp = document.getElementById('levelQuizInput');
  inp.focus();
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var btn = document.getElementById('levelQuizCheckBtn');
      btn.click();
    }
  });
}

window.checkLevelQuizAnswer = function() {
  var s = levelQuizState;
  var vocab = s.questions[s.current];
  var qd = getQuestionDirection(vocab);
  var inp = document.getElementById('levelQuizInput');
  var feedback = document.getElementById('levelQuizFeedback');
  var btn = document.getElementById('levelQuizCheckBtn');

  if (btn.textContent === t('next') || btn.textContent === t('finish')) {
    s.current++;
    renderLevelQuizQuestion();
    return;
  }

  var userAns = inp.value;
  var correct = isAnswerCorrect(userAns, qd.answer);

  if (correct) {
    s.correctCount++;
    inp.classList.add('correct');
    feedback.className = 'quiz-feedback correct';
    feedback.textContent = '✅ ' + t('correct');
  } else {
    inp.classList.add('wrong');
    feedback.className = 'quiz-feedback wrong';
    feedback.textContent = '❌ ' + t('wrong') + ' ' + t('correct_was') + ' ' + qd.answer;
  }

  inp.disabled = true;
  btn.textContent = (s.current + 1 >= s.totalQuestions) ? t('finish') : t('next');
};

function renderLevelQuizResults() {
  var s = levelQuizState;
  var container = document.getElementById('levelQuizContent');
  var pct = s.correctCount / s.totalQuestions;
  var passed = pct >= 0.6;
  var icon = passed ? '🏆' : '😞';
  var msg = passed ? t('passed') : t('failed');

  if (passed) {
    if (completedLevels.indexOf(s.level) === -1) {
      completedLevels.push(s.level);
    }
    if (s.level >= currentLevelNum) {
      currentLevelNum = s.level + 1;
      if (currentLevelNum > 50) currentLevelNum = 50;
    }
    addXP(s.xpReward);
    checkBossRewards();
  }

  var bossUnlock = '';
  if (passed && s.isBoss) {
    var item = getBossItem(s.level);
    if (item && unlockedItems.indexOf(item.id) === -1) {
      unlockedItems.push(item.id);
      bossUnlock = '<div style="margin-top:16px;padding:16px;background:rgba(245,158,11,0.1);border-radius:12px;color:var(--gold);font-weight:700;">' +
        '🎁 ' + t('new_item') + ' ' + item.name + '</div>';
    }
  }

  saveState();

  container.innerHTML = '<div class="results-container">' +
    '<div class="results-icon">' + icon + '</div>' +
    '<h2>' + (s.isBoss && passed ? t('boss_complete') : (passed ? t('level_complete') : msg)) + '</h2>' +
    '<div class="results-score">' + s.correctCount + ' / ' + s.totalQuestions + '</div>' +
    '<div class="results-detail">' + (passed ? '+' + s.xpReward + ' XP' : t('failed')) + '</div>' +
    '<div class="results-stats">' +
    '<div class="results-stat"><div class="stat-value" style="color:var(--green)">' + s.correctCount + '</div><div class="stat-label">' + t('correct_count') + '</div></div>' +
    '<div class="results-stat"><div class="stat-value" style="color:var(--red)">' + (s.totalQuestions - s.correctCount) + '</div><div class="stat-label">' + t('wrong_count') + '</div></div>' +
    '</div>' +
    bossUnlock +
    '<button class="quiz-btn quiz-btn-primary" onclick="navigateTo(\'levels\')" style="margin-top:20px">' + t('back') + '</button>' +
    '</div>';
}

  var inp = document.getElementById('dailyQuizInput');

window.checkDailyAnswer = function() {

  var qd = getQuestionDirection(vocab);

  var feedback = document.getElementById('dailyQuizFeedback');

  if (btn.textContent === t('next') || btn.textContent === t('finish')) {
    s.current++;

function initTestPage() {

    '<p style="color:var(--text2);font-size:12px;margin-bottom:16px">0.6 Pkt ' + t('translation_q') + ' + 0.5 Pkt ' + t('genitiv') + '/' + t('genus') + '</p>' +

window.startVocabTest = function() {
  var lesson = document.getElementById('testLessonFilter').value;
  var pool = shuffleArray(getVocabByLesson(lesson)).slice(0, 15);

  testQuizState = {
    questions: pool,
    current: 0,
    totalScore: 0,
    maxScore: 16.5,
    totalQuestions: pool.length,
    results: []
  };
  renderTestQuestion();

function renderTestQuestion() {
  var s = testQuizState;
  var container = document.getElementById('testContent');

  if (s.current >= s.totalQuestions) {
    renderTestResults();
    return;
  }

  var vocab = s.questions[s.current];
  var qd = getQuestionDirection(vocab);
  var progress = (s.current / s.totalQuestions) * 100;
  var hasGenGenu = (vocab.genitiv && vocab.genitiv !== '-') || (vocab.genus && vocab.genus !== '-');

  var genGenHtml = '';
  if (hasGenGenu) {
    genGenHtml = '<div class="sub-question">';
    if (vocab.genitiv && vocab.genitiv !== '-') {
      genGenHtml += '<label>' + t('genitiv_q') + ':</label><input id="testGenInput" type="text" placeholder="' + t('genitiv') + '" autocomplete="off" />';
    }
    if (vocab.genus && vocab.genus !== '-') {
      genGenHtml += '<label style="margin-top:8px">' + t('genus_q') + ':</label>' +
        '<select id="testGenusSelect"><option value="">--</option><option value="m.">m.</option><option value="f.">f.</option><option value="n.">n.</option></select>';
    }
    genGenHtml += '</div>';
  }

  container.innerHTML = '<div class="quiz-container">' +
    '<div class="quiz-header">' +
    '<span class="lesson-badge">📝 ' + t('nav_test') + '</span>' +
    '<span>' + (s.current + 1) + ' / ' + s.totalQuestions + '</span>' +
    '</div>' +
    '<div class="quiz-progress"><div class="quiz-progress-fill" style="width:' + progress + '%"></div></div>' +
    '<div class="quiz-question" id="testQuestionArea">' +
    '<div class="q-label">' + qd.label + '</div>' +
    '<div class="q-word">' + qd.question + '</div>' +
    '<input class="quiz-input" id="testTransInput" type="text" placeholder="' + t('your_answer') + '" autocomplete="off" />' +
    genGenHtml +
    '<div id="testFeedback"></div>' +
    '<br/><button class="quiz-btn quiz-btn-primary" id="testCheckBtn" onclick="checkTestAnswer()">' + t('check') + '</button>' +
    '</div></div>';

  document.getElementById('testTransInput').focus();
  document.getElementById('testTransInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('testCheckBtn').click();
  });
}

window.checkTestAnswer = function() {
  var s = testQuizState;
  var vocab = s.questions[s.current];
  var qd = getQuestionDirection(vocab);
  var transInput = document.getElementById('testTransInput');
  var feedback = document.getElementById('testFeedback');
  var btn = document.getElementById('testCheckBtn');

  if (btn.textContent === t('next') || btn.textContent === t('finish')) {
    s.current++;
    renderTestQuestion();
    return;
  }

  var transCorrect = isAnswerCorrect(transInput.value, qd.answer);
  var transPoints = transCorrect ? 0.6 : 0;
  var genGenPoints = 0;
  var genGenMax = 0;

  var hasGen = vocab.genitiv && vocab.genitiv !== '-';
  var hasGenus = vocab.genus && vocab.genus !== '-';

  if (hasGen || hasGenus) {
    genGenMax = 0.5;
    var genCorrect = true;
    var genusCorrect = true;

    if (hasGen) {
      var genInput = document.getElementById('testGenInput');
      if (genInput) {
        genCorrect = isAnswerCorrect(genInput.value, vocab.genitiv);
        genInput.disabled = true;
        genInput.style.borderColor = genCorrect ? 'var(--green)' : 'var(--red)';
      }
    }

    if (hasGenus) {
      var genusSelect = document.getElementById('testGenusSelect');
      if (genusSelect) {
        genusCorrect = genusSelect.value.trim().toLowerCase() === vocab.genus.trim().toLowerCase();
        genusSelect.disabled = true;
        genusSelect.style.borderColor = genusCorrect ? 'var(--green)' : 'var(--red)';
      }
    }

    if (hasGen && hasGenus) {
      genGenPoints = (genCorrect && genusCorrect) ? 0.5 : 0;
    } else {
      genGenPoints = ((hasGen && genCorrect) || (hasGenus && genusCorrect)) ? 0.5 : 0;
    }
  }

  var totalPts = transPoints + genGenPoints;
  s.totalScore += totalPts;

  transInput.disabled = true;
  if (transCorrect) {
    transInput.classList.add('correct');
  } else {
    transInput.classList.add('wrong');
  }

  var feedbackHtml = '';
  if (transCorrect && (genGenMax === 0 || genGenPoints > 0)) {
    feedbackHtml = '<div class="quiz-feedback correct">✅ ' + t('correct') + ' (+' + totalPts.toFixed(1) + ')</div>';
  } else {
    feedbackHtml = '<div class="quiz-feedback wrong">❌ ' + t('correct_was') + ' ' + qd.answer;
    if (hasGen) feedbackHtml += ' | ' + t('genitiv') + ': ' + vocab.genitiv;
    if (hasGenus) feedbackHtml += ' | ' + t('genus') + ': ' + vocab.genus;
    feedbackHtml += ' (+' + totalPts.toFixed(1) + ')</div>';
  }
  feedback.innerHTML = feedbackHtml;

  btn.textContent = (s.current + 1 >= s.totalQuestions) ? t('finish') : t('next');
};

function renderInventory() {

    var cls = 'inventory-item';

    if (!isUnlocked) cls += ' locked';

    var btnText = '';

      btnText = t('locked_item') + ' (' + t('level') + ' ' + item.level + ')';
    } else if (isEquipped) {
      btnText = '✅ ' + t('unequip');
    } else {
      btnText = t('equip');
    }

    var div = document.createElement('div');
    div.className = cls;
    div.innerHTML = '<div class="item-icon">' + item.icon + '</div>' +
      '<div class="item-name">' + item.name + '</div>' +
      '<div class="item-req">' + btnText + '</div>';

    if (isUnlocked) {
      div.setAttribute('data-item-id', item.id);
      div.onclick = (function(id) {
        return function() { toggleEquipItem(id); };
      })(item.id);
    }

    container.appendChild(div);
